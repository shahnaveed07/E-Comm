name: CI Pipeline

on:
  push:
    branches: [main, master, develop, feat/production-upgrade]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: sylvan_grove_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci_root_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      DATABASE_URL: mysql://root:ci_root_password@127.0.0.1:3306/sylvan_grove_ci
      SESSION_SECRET: ci-session-secret-key-at-least-32-chars-long
      STORE_CURRENCY: INR
      UPI_QR_ENABLED: 'true'
      UPI_MERCHANT_VPA: sylvangrove@icici
      UPI_MERCHANT_NAME: Sylvan Grove Orchard

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate & generate Prisma schema
        run: |
          npx prisma validate
          npx prisma generate

      - name: Apply Prisma migrations to MySQL 8
        run: npx prisma migrate deploy

      - name: Seed baseline MySQL catalog
        run: npm run prisma:seed

      - name: Lint TypeScript types
        run: npm run lint

      - name: Run unit & API integration tests
        run: npm test

      - name: Build production Vite bundle
        run: npm run build
